ly="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a52a8" text-anchor="middle" letter-spacing="0">?</text><text x="680" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#0f1538" text-anchor="start" letter-spacing="0">Who submits and approves timesheets?</text><rect x="610" y="350" width="900" height="62" rx="31" fill="#ffffff" stroke="#e1e6f0" stroke-width="2" /><circle cx="645" cy="381" r="17" fill="#eaf1fb"/><text x="645" y="389" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a52a8" text-anchor="middle" letter-spacing="0">?</text><text x="680" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#0f1538" text-anchor="start" letter-spacing="0">How is a rate set per client?</text><rect x="610" y="430" width="900" height="62" rx="31" fill="#ffffff" stroke="#e1e6f0" stroke-width="2" /><circle cx="645" cy="461" r="17" fill="#eaf1fb"/><text x="645" y="469" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a52a8" text-anchor="middle" letter-spacing="0">?</text><text x="680" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#0f1538" text-anchor="start" letter-spacing="0">Which GST rule applies, and when?</text><rect x="610" y="510" width="900" height="62" rx="31" fill="#ffffff" stroke="#e1e6f0" stroke-width="2" /><circle cx="645" cy="541" r="17" fill="#eaf1fb"/><text x="645" y="549" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a52a8" text-anchor="middle" letter-spacing="0">?</text><text x="680" y="550" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#0f1538" text-anchor="start" letter-spacing="0">Who signs off an invoice?</text><rect x="610" y="590" width="900" height="62" rx="31" fill="#ffffff" stroke="#e1e6f0" stroke-width="2" /><circle cx="645" cy="621" r="17" fill="#eaf1fb"/><text x="645" y="629" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a52a8" text-anchor="middle" letter-spacing="0">?</text><text x="680" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#0f1538" text-anchor="start" letter-spacing="0">How does each client pay?</text><rect x="610" y="670" width="900" height="62" rx="31" fill="#ffffff" stroke="#e1e6f0" stroke-width="2" /><circle cx="645" cy="701" r="17" fill="#eaf1fb"/><text x="645" y="709" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a52a8" text-anchor="middle" letter-spacing="0">?</text><text x="680" y="710" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#0f1538" text-anchor="start" letter-spacing="0">How is a payment matched to an invoice?</text><text x="90" y="880" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#5b6488" text-anchor="start" letter-spacing="0">Every unknown in the PRD became a question to take to the people doing the work.</text></svg>