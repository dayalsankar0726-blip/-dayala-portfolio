<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100"><rect width="1600" height="1100" fill="#f6f8fc"/><text x="90" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#3b82c4" text-anchor="start" letter-spacing="4">INVOICE LIFECYCLE</text><text x="90" y="175" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#0f1538" text-anchor="start" letter-spacing="0">Every invoice has one clear status</text><circle cx="150" cy="300" r="26" fill="#5b6488"/><text x="150" y="309" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">1</text><line x1="150" y1="330" x2="150" y2="405" stroke="#e1e6f0" stroke-width="4"/><rect x="210" y="250" width="1300" height="100" rx="18" fill="#ffffff" stroke="#e1e6f0" stroke-width="2" /><text x="250" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f1538" text-anchor="start" letter-spacing="0">Draft</text><text x="250" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5b6488" text-anchor="start" letter-spacing="0">Finance Admin builds it</text><circle cx="150" cy="435" r="26" fill="#c98a12"/><text x="150" y="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">2</text><line x1="150" y1="465" x2="150" y2="540" stroke="#e1e6f0" stroke-width="4"/><rect x="210" y="385" width="1300" height="100" rx="18" fill="#ffffff" stroke="#e1e6f0" stroke-width="2" /><text x="250" y="431" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f1538" text-anchor="start" letter-spacing="0">Pending approval</text><text x="250" y="465" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5b6488" text-anchor="start" letter-spacing="0">Waiting inside the SLA</text><circle cx="150" cy="570" r="26" fill="#2a52a8"/><text x="150" y="579" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">3</text><line x1="150" y1="600" x2="150" y2="675" stroke="#e1e6f0" stroke-width="4"/><rect x="210" y="520" width="1300" height="100" rx="18" fill="#ffffff" stroke="#e1e6f0" stroke-width="2" /><text x="250" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f1538" text-anchor="start" letter-spacing="0">Approved</text><text x="250" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5b6488" text-anchor="start" letter-spacing="0">Locked — no more edits</text><circle cx="150" cy="705" r="26" fill="#3b82c4"/><text x="150" y="714" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">4</text><line x1="150" y1="735" x2="150" y2="810" stroke="#e1e6f0" stroke-width="4"/><rect x="210" y="655" width="1300" height="100" rx="18" fill="#ffffff" stroke="#e1e6f0" stroke-width="2" /><text x="250" y="701" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f1538" text-anchor="start" letter-spacing="0">Sent</text><text x="250" y="735" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5b6488" text-anchor="start" letter-spacing="0">Delivery tracked</text><circle cx="150" cy="840" r="26" fill="#8a5cf6"/><text x="150" y="849" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">5</text><line x1="150" y1="870" x2="150" y2="945" stroke="#e1e6f0" stroke-width="4"/><rect x="210" y="790" width="1300" height="100" rx="18" fill="#ffffff" stroke="#e1e6f0" stroke-width="2" /><text x="250" y="836" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f1538" text-anchor="start" letter-spacing="0">Partially paid</text><text x="250" y="870" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5b6488" text-anchor="start" letter-spacing="0">Balance stays open</text><circle cx="150" cy="975" r="26" fill="#1f9d63"/><text x="150" y="984" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">6</text><rect x="210" y="925" width="1300" height="100" rx="18" fill="#ffffff" stroke="#e1e6f0" stroke-width="2" /><text x="250" y="971" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f1538" text-anchor="start" letter-spacing="0">Paid / Overdue</text><text x="250" y="1005" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5b6488" text-anchor="start" letter-spacing="0">Closed — or flagged</text></svg>