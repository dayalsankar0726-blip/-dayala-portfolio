<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"><rect width="1600" height="1000" fill="#f6f8fc"/><text x="90" y="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#3b82c4" text-anchor="start" letter-spacing="4">STEP 02</text><text x="90" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#0f1538" text-anchor="start" letter-spacing="0">Sessions with HR and Finance</text><rect x="90" y="260" width="660" height="560" rx="18" fill="#ffffff" stroke="#e1e6f0" stroke-width="2" /><circle cx="160" cy="330" r="34" fill="#2a52a8"/><text x="160" y="341" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">H</text><text x="215" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f1538" text-anchor="start" letter-spacing="0">HR team</text><text x="215" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5b6488" text-anchor="start" letter-spacing="0">Consultants, assignments, rates</text><rect x="130" y="420" width="580" height="86" rx="14" fill="#f6f8fc"/><text x="160" y="455" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#0f1538" text-anchor="start" letter-spacing="0">Onboarding consultants</text><text x="160" y="487" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#5b6488" text-anchor="start" letter-spacing="0">Who sets up the person, client and project</text><rect x="130" y="530" width="580" height="86" rx="14" fill="#f6f8fc"/><text x="160" y="565" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#0f1538" text-anchor="start" letter-spacing="0">Assignments &amp; rates</text><text x="160" y="597" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#5b6488" text-anchor="start" letter-spacing="0">Hourly vs daily, rate changes, end dates</text><rect x="130" y="640" width="580" height="86" rx="14" fill="#f6f8fc"/><text x="160" y="675" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#0f1538" text-anchor="start" letter-spacing="0">Timesheet chasing</text><text x="160" y="707" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#5b6488" text-anchor="start" letter-spacing="0">Reminders sent one person at a time</text><rect x="850" y="260" width="660" height="560" rx="18" fill="#ffffff" stroke="#e1e6f0" stroke-width="2" /><circle cx="920" cy="330" r="34" fill="#1a1f5e"/><text x="920" y="341" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">F</text><text x="975" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f1538" text-anchor="start" letter-spacing="0">Finance team</text><text x="975" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5b6488" text-anchor="start" letter-spacing="0">Invoices, tax, payments</text><rect x="890" y="420" width="580" height="86" rx="14" fill="#f6f8fc"/><text x="920" y="455" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#0f1538" text-anchor="start" letter-spacing="0">Invoice maths &amp; GST</text><text x="920" y="487" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#5b6488" text-anchor="start" letter-spacing="0">Rates, currency and tax worked out by hand</text><rect x="890" y="530" width="580" height="86" rx="14" fill="#f6f8fc"/><text x="920" y="565" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#0f1538" text-anchor="start" letter-spacing="0">Sign-off over email</text><text x="920" y="597" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#5b6488" text-anchor="start" letter-spacing="0">No queue, no priority, no time limit</text><rect x="890" y="640" width="580" height="86" rx="14" fill="#f6f8fc"/><text x="920" y="675" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#0f1538" text-anchor="start" letter-spacing="0">Payment follow-up</text><text x="920" y="707" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#5b6488" text-anchor="start" letter-spacing="0">Matching bank credits to invoices manually</text><text x="90" y="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#5b6488" text-anchor="start" letter-spacing="0">Every question answered — then the answers were checked against what people actually did.</text></svg>