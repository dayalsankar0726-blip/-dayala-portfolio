name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # lets GitHub sign in to AWS without stored keys
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::765151565807:role/dayala-portfolio-DeployRole-Z51InalQ64q1
  S3_BUCKET: dayala-portfolio-sitebucket-35rrup3wwqfr
  CF_DISTRIBUTION_ID: E23AS0TRVTIE1I

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build the upload folder (site files only)
        run: |
          rsync -a ./ site/ \
            --exclude '.git' --exclude '.github' --exclude '.claude' --exclude 'site' \
            --exclude 'infra' --exclude 'scripts' --exclude 'scratchpad' \
            --exclude 'README.md' --exclude 'CNAME' --exclude 'DS Logo.svg' \
            --exclude '.gitignore' --exclude '.DS_Store'

      - name: Upload images, fonts and media (cached for 1 year)
        run: |
          LONG="public,max-age=31536000,immutable"
          aws s3 sync site/ "s3://$S3_BUCKET/" --delete --exclude '*.html' \
            --exclude '*.webp' --exclude '*.avif' --exclude '*.css' --exclude '*.js' \
            --exclude 'robots.txt' --exclude 'sitemap.xml' --cache-control "$LONG"
          aws s3 sync site/ "s3://$S3_BUCKET/" --exclude '*' --include '*.webp' \
            --content-type image/webp --cache-control "$LONG"
          aws s3 sync site/ "s3://$S3_BUCKET/" --exclude '*' --include '*.avif' \
            --content-type image/avif --cache-control "$LONG"

      - name: Upload CSS and JS (browsers re-check each visit, so edits show at once)
        run: |
          aws s3 sync site/ "s3://$S3_BUCKET/" --exclude '*' --include '*.css' --include '*.js' \
            --cache-control "no-cache"

      - name: Upload pages (always fresh)
        run: |
          aws s3 sync site/ "s3://$S3_BUCKET/" --exclude '*' --include '*.html' \
            --content-type 'text/html; charset=utf-8' --cache-control "no-cache"
          aws s3 cp site/robots.txt "s3://$S3_BUCKET/robots.txt" --content-type 'text/plain; charset=utf-8' --cache-control "no-cache"
          aws s3 cp site/sitemap.xml "s3://$S3_BUCKET/sitemap.xml" --content-type 'application/xml' --cache-control "no-cache"

      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$CF_DISTRIBUTION_ID" --paths '/*'
